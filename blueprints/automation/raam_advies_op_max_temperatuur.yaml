blueprint:
  name: Raamadvies bij hoge maximumtemperatuur
  description: >
    Geeft advies (open/dicht) over een raam, gebaseerd op binnen- en
    buitentemperatuur en de raamstatus, maar alleen op dagen waarop de
    verwachte maximumtemperatuur boven een instelbare drempel ligt.
    Het advies wordt eenmalig als notificatie gestuurd en alleen opnieuw
    gestuurd als het advies wijzigt (geen herhaalmeldingen bij gelijk advies).
  domain: automation
  source_url: https://github.com/

  input:
    buiten_temperatuur_sensor:
      name: Buitentemperatuur sensor
      description: De sensor die de huidige buitentemperatuur meet.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    binnen_temperatuur_sensor:
      name: Binnentemperatuur sensor
      description: De sensor die de huidige binnentemperatuur meet.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    max_temperatuur_vandaag_sensor:
      name: Maximumtemperatuur van vandaag sensor
      description: De sensor met de verwachte maximumtemperatuur voor vandaag.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    raam_sensor:
      name: Raamsensor
      description: >
        De binary sensor die aangeeft of het raam open of dicht is. Let op:
        sommige raamsensoren (zoals IKEA MYGGBETT) gebruiken device_class
        "door" in plaats van "window" - beide worden hier getoond.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - window
            - door

    drempel_max_temperatuur:
      name: Drempelwaarde maximumtemperatuur
      description: >
        Alleen als de maximumtemperatuur van vandaag boven deze waarde komt,
        wordt er advies gegeven.
      default: 22
      selector:
        number:
          min: 0
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

    trend_helper:
      name: Trend-geheugen voor binnentemperatuur (input_text)
      description: >
        Maak eenmalig een tweede input_text helper aan (zelfde manier als
        bij de geheugen-helper, type "Tekst", max lengte minimaal 50
        tekens) en selecteer die hier. De blueprint gebruikt deze om zelf
        bij te houden wat de binnentemperatuur was, zodat berekend kan
        worden of de temperatuur de afgelopen periode is opgelopen. Gebruik
        per raam een eigen helper (dus niet dezelfde als de geheugen-helper
        en niet delen met een ander raam).
      selector:
        entity:
          domain: input_text

    stijging_periode_minuten:
      name: Periode voor temperatuurstijging (advies 1)
      description: >
        Aantal minuten waarover gekeken wordt of de binnentemperatuur is
        opgelopen, voor advies 1 (raam open, binnen kouder dan buiten, maar
        binnentemperatuur loopt op).
      default: 15
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: minuten
          mode: box

    notificatie_titel:
      name: Titel van de melding
      description: >
        De titel die boven de melding wordt weergegeven.
      default: "Raamadvies"
      selector:
        text:

    notificatie_bericht:
      name: Inhoud van de melding
      description: >
        De tekst van de melding. Gebruik {advies} op de plek waar het
        berekende advies ("Het raam moet dicht." of "Het raam moet open.")
        moet komen te staan.
      default: "{advies}"
      selector:
        text:

    notificatie_apparaten:
      name: Telefoons voor melding
      description: >
        Selecteer de mobiele apparaten (telefoons met de Home Assistant
        Companion App) die de melding moeten ontvangen.
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true

    geheugen_helper:
      name: Geheugen-helper (input_text)
      description: >
        Maak in Instellingen > Apparaten & Diensten > Helpers een nieuwe
        helper aan van het type "Tekst" (input_text, max lengte minimaal 20
        tekens) en selecteer die hier. Deze helper wordt door de blueprint
        gebruikt om te onthouden welk advies het laatst is gegeven, zodat
        je niet steeds opnieuw een melding krijgt voor hetzelfde advies.
        Gebruik per raam een eigen helper.
      selector:
        entity:
          domain: input_text

    check_interval_minuten:
      name: Controle-interval
      description: >
        Naast directe controle bij wijziging van een sensor, wordt ook op
        dit vaste interval (in minuten) gecontroleerd of het advies nog
        klopt.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: minuten
          mode: box

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input buiten_temperatuur_sensor
  - platform: state
    entity_id: !input binnen_temperatuur_sensor
  - platform: state
    entity_id: !input max_temperatuur_vandaag_sensor
  - platform: state
    entity_id: !input raam_sensor
  - platform: time_pattern
    minutes: !input check_interval_minuten

variables:
  buiten_temperatuur_sensor: !input buiten_temperatuur_sensor
  binnen_temperatuur_sensor: !input binnen_temperatuur_sensor
  max_temperatuur_vandaag_sensor: !input max_temperatuur_vandaag_sensor
  raam_sensor: !input raam_sensor
  drempel_max_temperatuur: !input drempel_max_temperatuur
  stijging_periode_minuten: !input stijging_periode_minuten
  trend_helper: !input trend_helper
  geheugen_helper: !input geheugen_helper
  notificatie_titel: !input notificatie_titel
  notificatie_bericht: !input notificatie_bericht

  buiten_temp: "{{ states(buiten_temperatuur_sensor) | float(none) }}"
  binnen_temp: "{{ states(binnen_temperatuur_sensor) | float(none) }}"
  max_temp_vandaag: "{{ states(max_temperatuur_vandaag_sensor) | float(none) }}"
  raam_open: "{{ is_state(raam_sensor, 'on') }}"

  vorig_advies: "{{ states(geheugen_helper) | trim }}"

  drempel_overschreden: >
    {{ max_temp_vandaag is not none and max_temp_vandaag > drempel_max_temperatuur }}

  geldige_metingen: >
    {{ buiten_temp is not none and binnen_temp is not none }}

condition:
  - condition: template
    value_template: "{{ drempel_overschreden and geldige_metingen }}"

action:
  - variables:
      trend_opgeslagen: "{{ states(trend_helper) | trim }}"
      trend_temp_oud: >
        {{ trend_opgeslagen.split('|')[0] | float(none)
           if '|' in trend_opgeslagen else none }}
      trend_tijd_oud_ts: >
        {{ trend_opgeslagen.split('|')[1] | float(none)
           if '|' in trend_opgeslagen else none }}
      trend_nu_ts: "{{ as_timestamp(now()) }}"
      trend_leeftijd_minuten: >
        {{ ((trend_nu_ts - trend_tijd_oud_ts) / 60)
           if trend_tijd_oud_ts is not none else none }}
      trend_geldig: >
        {{ trend_temp_oud is not none and trend_leeftijd_minuten is not none
           and trend_leeftijd_minuten >= stijging_periode_minuten }}

      binnen_loopt_op: >
        {{ trend_geldig and binnen_temp is not none
           and binnen_temp > trend_temp_oud }}

      nieuw_advies: >
        {% if raam_open and binnen_temp < buiten_temp and binnen_loopt_op %}
          raam_dicht_1
        {% elif not raam_open and binnen_temp > buiten_temp %}
          raam_open_2
        {% elif raam_open and binnen_temp > buiten_temp %}
          raam_open_3
        {% elif not raam_open and binnen_temp < buiten_temp %}
          raam_dicht_4
        {% else %}
          geen_advies
        {% endif %}
      nieuw_advies_clean: "{{ nieuw_advies | trim }}"

      advies_conclusie: >
        {% if nieuw_advies_clean in ['raam_dicht_1', 'raam_dicht_4'] %}
          raam_dicht
        {% elif nieuw_advies_clean in ['raam_open_2', 'raam_open_3'] %}
          raam_open
        {% else %}
          geen_advies
        {% endif %}
      advies_conclusie_clean: "{{ advies_conclusie | trim }}"

      advies_tekst_raw: >
        {% if advies_conclusie_clean == 'raam_dicht' %}
          Het raam moet dicht.
        {% elif advies_conclusie_clean == 'raam_open' %}
          Het raam moet open.
        {% else %}
          ""
        {% endif %}
      advies_tekst: "{{ advies_tekst_raw | trim }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ binnen_temp is not none
                 and (trend_temp_oud is none or trend_tijd_oud_ts is none
                      or trend_geldig) }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ trend_helper }}"
            data:
              value: "{{ binnen_temp }}|{{ trend_nu_ts }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ advies_conclusie_clean != 'geen_advies' and advies_conclusie_clean != vorig_advies }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ geheugen_helper }}"
            data:
              value: "{{ advies_conclusie_clean }}"

          - repeat:
              for_each: !input notificatie_apparaten
              sequence:
                - action: notify.send_message
                  target:
                    device_id: "{{ repeat.item }}"
                  data:
                    title: "{{ notificatie_titel | replace('{advies}', advies_tekst) }}"
                    message: "{{ notificatie_bericht | replace('{advies}', advies_tekst) }}"
