blueprint:
  name: Temperature Comparison with Window Notification
  description: >
    Keep your home comfortable by comparing outdoor and indoor temperatures.
    A summer mode activates when today's forecast temperature exceeds a set threshold.
    When active, you receive advice to open or close the window based on whether it
    is warmer or cooler outside than inside. Notifications are only sent when the
    advice changes, or when the window is opened or closed while it should not be.
    Notification texts can be sent in English, Dutch, German or Spanish.
  domain: automation
  input:

    temperature_settings:
      name: Temperature settings
      icon: mdi:thermometer
      collapsed: true
      input:
        notification_language:
          name: Notification language
          description: >
            Choose the language for notification messages.
          default: en
          selector:
            select:
              options:
                - label: English
                  value: en
                - label: Nederlands
                  value: nl
                - label: Deutsch
                  value: de
                - label: Español
                  value: es
              custom_value: false
              multiple: false
              sort: false

        room_name:
          name: Room name
          description: >
            The name of the room this automation applies to,
            e.g. 'Living room' or 'Bedroom'. Used in notifications.
          default: "My room"
          selector:
            text:

        outdoor_temperature:
          name: Outdoor temperature sensor
          description: >
            The sensor that measures the current outdoor temperature.
          selector:
            entity:
              domain: sensor
              device_class: temperature

        indoor_temperature:
          name: Indoor temperature sensor
          description: >
            The sensor that measures the indoor temperature.
          selector:
            entity:
              domain: sensor
              device_class: temperature

        state_helper:
          name: Text helper for tracking the last advice
          description: >
            Create an input_text helper via Settings → Helpers → Add → Text.
            This helper remembers the last advice so you only receive a notification
            when the advice changes. Create a separate helper for each automation.
          selector:
            entity:
              domain: input_text

    summer_mode_settings:
      name: Summer mode activation
      icon: mdi:weather-sunny
      collapsed: true
      input:
        forecast_sensor:
          name: Today's expected maximum temperature sensor (optional)
          description: >
            Choose a sensor that provides today's expected maximum temperature,
            e.g. sensor.buienradar_temperature_1d or sensor.openweathermap_forecast_max_temp.
            Leave empty if you are using a helper instead.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: temperature

        forecast_helper:
          name: Today's expected maximum temperature helper (optional)
          description: >
            Use an input_number helper as an alternative to the sensor.
            Set the value manually each day, or let another automation do this.
            Leave empty if you are using a sensor instead.
          default: []
          selector:
            entity:
              domain: input_number

        minimum_temperature:
          name: Minimum daily temperature for summer mode (°C)
          description: >
            Summer mode is active when today's expected maximum temperature
            reaches or exceeds this value.
          default: 20
          selector:
            number:
              min: 15
              max: 35
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

    window_settings:
      name: Window settings
      icon: mdi:window-open
      collapsed: true
      input:
        window_sensor:
          name: Window sensor (optional)
          description: >
            Choose a window or door sensor. Leave empty to skip.
          default: []
          selector:
            entity:
              domain: binary_sensor
              device_class:
                - window
                - door
                - opening

    automation_settings:
      name: Automation settings
      icon: mdi:cog-outline
      collapsed: true
      input:
        check_every:
          name: Check interval
          description: >
            How often should the automation check?
          default: /15
          selector:
            select:
              options:
                - label: Every 5 minutes
                  value: /5
                - label: Every 10 minutes
                  value: /10
                - label: Every 15 minutes
                  value: /15
                - label: Every 30 minutes
                  value: /30
                - label: Every hour
                  value: /60
              custom_value: false
              multiple: false
              sort: false

    notification_settings:
      name: Notification settings
      icon: mdi:bell-check-outline
      collapsed: true
      input:
        notification_enabled:
          name: Enable notifications
          description: >
            Enable notifications to receive an alert on your devices
            when the advice changes or the window is in the wrong position.
          default: disable_notification
          selector:
            select:
              options:
                - label: Enable notifications
                  value: enable_notification
                - label: Disable notifications
                  value: disable_notification
              custom_value: false
              multiple: false
              sort: false

        notification_devices:
          name: Devices to notify
          description: >
            Select the devices that will receive a notification.
            Only devices with the Home Assistant app are shown.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

variables:
  lang: !input notification_language
  room_name: !input room_name
  outdoor_sensor: !input outdoor_temperature
  indoor_sensor: !input indoor_temperature
  state_helper: !input state_helper
  forecast_sensor: !input forecast_sensor
  forecast_helper: !input forecast_helper
  threshold: !input minimum_temperature
  window: !input window_sensor
  notification_on: !input notification_enabled
  devices: !input notification_devices
  outdoor_temp: "{{ states(outdoor_sensor) | float(0) | round(1) }}"
  indoor_temp: "{{ states(indoor_sensor) | float(0) | round(1) }}"
  outdoor_warmer: "{{ states(outdoor_sensor) | float(0) > states(indoor_sensor) | float(0) }}"

trigger:
  - id: time_trigger
    platform: time_pattern
    minutes: !input check_every

  - id: window_opened
    platform: state
    entity_id: !input window_sensor
    to: "on"

  - id: window_closed
    platform: state
    entity_id: !input window_sensor
    to: "off"

condition:
  # Summer mode: only active when today's forecast reaches the threshold
  - condition: template
    value_template: >
      {% if forecast_sensor | length > 0 %}
        {{ states(forecast_sensor) | float(0) >= threshold }}
      {% elif forecast_helper | length > 0 %}
        {{ states(forecast_helper) | float(0) >= threshold }}
      {% else %}
        false
      {% endif %}

action:
  - variables:
      window_open: >
        {% if window | length > 0 %}
          {{ is_state(window, 'on') }}
        {% else %}
          false
        {% endif %}

      # --- Taalafhankelijke teksten / Language-dependent texts ---

      txt_window_open: "{{ room_name + ': open' }}"
      txt_window_closed: >
        {% if lang == 'nl' %}{{ room_name + ': gesloten' }}
        {% elif lang == 'de' %}{{ room_name + ': geschlossen' }}
        {% elif lang == 'es' %}{{ room_name + ': cerrado' }}
        {% else %}{{ room_name + ': closed' }}{% endif %}

      window_status_text: >
        {% if window | length > 0 %}
          {% if window_open %}
            {{ txt_window_open }}
          {% else %}
            {{ txt_window_closed }}
          {% endif %}
        {% endif %}

      advice_text: >
        {% if lang == 'nl' %}
          {% if window | length > 0 %}
            {% if outdoor_warmer %}
              Het is buiten warmer dan binnen. Doe het raam dicht om de warmte buiten te houden en de kamer koel te houden.
            {% else %}
              Het is buiten koeler dan binnen. Doe het raam open om de koele lucht binnen te laten en de kamer af te koelen.
            {% endif %}
          {% else %}
            {% if outdoor_warmer %}
              Het is buiten warmer dan binnen — staat het raam al dicht?
            {% else %}
              Het is buiten koeler dan binnen — staat het raam al open?
            {% endif %}
          {% endif %}
        {% elif lang == 'de' %}
          {% if window | length > 0 %}
            {% if outdoor_warmer %}
              Es ist draußen wärmer als drinnen. Schließe das Fenster, um die Wärme draußen zu halten und den Raum kühl zu halten.
            {% else %}
              Es ist draußen kühler als drinnen. Öffne das Fenster, um die kühle Luft hereinzulassen und den Raum abzukühlen.
            {% endif %}
          {% else %}
            {% if outdoor_warmer %}
              Es ist draußen wärmer als drinnen — ist das Fenster schon geschlossen?
            {% else %}
              Es ist draußen kühler als drinnen — ist das Fenster schon geöffnet?
            {% endif %}
          {% endif %}
        {% elif lang == 'es' %}
          {% if window | length > 0 %}
            {% if outdoor_warmer %}
              Hace más calor fuera que dentro. Cierra la ventana para mantener el calor fuera y la habitación fresca.
            {% else %}
              Hace más frío fuera que dentro. Abre la ventana para dejar entrar el aire fresco y enfriar la habitación.
            {% endif %}
          {% else %}
            {% if outdoor_warmer %}
              Hace más calor fuera que dentro — ¿ya está la ventana cerrada?
            {% else %}
              Hace más frío fuera que dentro — ¿ya está la ventana abierta?
            {% endif %}
          {% endif %}
        {% else %}
          {% if window | length > 0 %}
            {% if outdoor_warmer %}
              It is warmer outside than inside. Close the window to keep the heat out and the room cool.
            {% else %}
              It is cooler outside than inside. Open the window to let the cool air in and cool the room down.
            {% endif %}
          {% else %}
            {% if outdoor_warmer %}
              It is warmer outside than inside — is the window already closed?
            {% else %}
              It is cooler outside than inside — is the window already open?
            {% endif %}
          {% endif %}
        {% endif %}

      message_title: >
        {% if lang == 'nl' %}
          {% if trigger.id == 'window_opened' %}
            {{ room_name }} opengegaan — actie mogelijk nodig
          {% elif trigger.id == 'window_closed' %}
            {{ room_name }} dichtgegaan — actie mogelijk nodig
          {% else %}
            {{ room_name }} — raamadvies
          {% endif %}
        {% elif lang == 'de' %}
          {% if trigger.id == 'window_opened' %}
            {{ room_name }} geöffnet — Maßnahme möglicherweise erforderlich
          {% elif trigger.id == 'window_closed' %}
            {{ room_name }} geschlossen — Maßnahme möglicherweise erforderlich
          {% else %}
            {{ room_name }} — Fensterempfehlung
          {% endif %}
        {% elif lang == 'es' %}
          {% if trigger.id == 'window_opened' %}
            {{ room_name }} abierta — puede ser necesario actuar
          {% elif trigger.id == 'window_closed' %}
            {{ room_name }} cerrada — puede ser necesario actuar
          {% else %}
            {{ room_name }} — consejo de ventana
          {% endif %}
        {% else %}
          {% if trigger.id == 'window_opened' %}
            {{ room_name }} opened — action may be needed
          {% elif trigger.id == 'window_closed' %}
            {{ room_name }} closed — action may be needed
          {% else %}
            {{ room_name }} — window advice
          {% endif %}
        {% endif %}

      txt_outdoor: >
        {% if lang == 'nl' %}Buiten
        {% elif lang == 'de' %}Außen
        {% elif lang == 'es' %}Exterior
        {% else %}Outdoor{% endif %}
      txt_indoor: >
        {% if lang == 'nl' %}Binnen
        {% elif lang == 'de' %}Innen
        {% elif lang == 'es' %}Interior
        {% else %}Indoor{% endif %}

      message_body: >
        {{ txt_outdoor }}: {{ outdoor_temp }}°C | {{ txt_indoor }}: {{ indoor_temp }}°C
        {% if window | length > 0 %}
        {{ window_status_text }}
        {% endif %}
        {{ advice_text }}

  # Only check if advice has changed when triggered by timer (skip for window state changes)
  - condition: template
    value_template: >
      {% if trigger.id == 'window_opened' or trigger.id == 'window_closed' %}
        true
      {% else %}
        {% set current_advice %}{% if outdoor_warmer %}window_closed{% else %}window_open{% endif %}{% endset %}
        {{ states(state_helper) != current_advice }}
      {% endif %}

  # No notification if the window is already in the desired position
  - condition: template
    value_template: >
      {% if window | length > 0 %}
        {% set window_is_open = is_state(window, 'on') %}
        {% if outdoor_warmer %}
          {{ window_is_open }}
        {% else %}
          {{ not window_is_open }}
        {% endif %}
      {% else %}
        true
      {% endif %}

  - condition: template
    value_template: "{{ notification_on == 'enable_notification' }}"

  - repeat:
      for_each: "{{ devices }}"
      sequence:
        - variables:
            notify_service: >
              {{ 'notify.mobile_app_' ~ device_attr(repeat.item, 'name')
                  | lower | replace(' ', '_') }}
        - service: "{{ notify_service }}"
          data:
            title: "{{ message_title }}"
            message: "{{ message_body }}"

  # Save the current advice to the helper
  - service: input_text.set_value
    target:
      entity_id: "{{ state_helper }}"
    data:
      value: "{% if outdoor_warmer %}window_closed{% else %}window_open{% endif %}"

mode: single
max_exceeded: silent
